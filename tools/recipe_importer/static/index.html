<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#181825">
    <title>Add Recipes | Mon Manger</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/styles.css">
    <script src="https://unpkg.com/lucide@latest" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="https://monmanger.com" target="_blank" rel="noreferrer">
          <img src="/favicon.svg" width="24" height="24" alt="">
          <strong>Mon Manger</strong>
          <span class="brand-divider" aria-hidden="true"></span>
          <span class="desk-name">Add Recipes</span>
        </a>
        <div class="connection" id="connection" aria-live="polite">
          <span class="connection-dot"></span>
          <span id="connection-label">Checking</span>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="intake" aria-labelledby="intake-title">
        <div class="section-heading entrance">
          <div>
            <h1 id="intake-title">Add recipes</h1>
            <p class="section-note">Add from a link or paste the full recipe.</p>
          </div>
        </div>

        <form id="recipe-form" class="recipe-form entrance" novalidate>
          <fieldset class="source-picker">
            <legend class="visually-hidden">Recipe source</legend>
            <div class="source-tabs">
              <label class="source-tab">
                <input type="radio" name="source-mode" value="link" checked>
                <span><i data-lucide="link" aria-hidden="true"></i> Recipe link</span>
              </label>
              <label class="source-tab">
                <input type="radio" name="source-mode" value="text">
                <span><i data-lucide="clipboard-paste" aria-hidden="true"></i> Paste recipe</span>
              </label>
            </div>
          </fieldset>

          <div class="source-panel" id="link-source">
            <div class="field-group">
              <label for="urls">Recipe link <span>one per line</span></label>
              <textarea id="urls" name="urls" rows="6" spellcheck="false" placeholder="https://example.com/a-recipe-you-love"></textarea>
              <span class="url-count" id="url-count">0 / 5</span>
            </div>
          </div>

          <div class="source-panel" id="text-source" hidden>
            <div class="field-group">
              <label for="recipe-text">Full recipe <span>one recipe</span></label>
              <textarea id="recipe-text" name="recipe-text" rows="12" maxlength="50000" placeholder="Recipe name&#10;&#10;Ingredients&#10;...&#10;&#10;Directions&#10;..."></textarea>
            </div>
          </div>

          <div class="field-group">
            <label for="notes">Anything to change? <span>optional</span></label>
            <textarea id="notes" name="notes" rows="3" maxlength="4000" placeholder="For example: make it serve six, or keep the air fryer method"></textarea>
          </div>

          <div class="form-actions">
            <label class="review-toggle" for="pause-review">
              <input id="pause-review" name="pause-review" type="checkbox">
              <span class="toggle-track" aria-hidden="true"><span></span></span>
              <span class="review-copy">
                <strong>Review before publishing</strong>
                <small>Stops before going live so you can check it.</small>
              </span>
            </label>
            <button class="primary-button" id="submit-button" type="submit">
              <i data-lucide="plus" aria-hidden="true"></i>
              <span>Add recipe</span>
            </button>
          </div>
        </form>

        <div class="result-panel entrance" id="result-panel" hidden aria-live="polite">
          <div class="result-icon"><i data-lucide="loader-circle" aria-hidden="true"></i></div>
          <div>
            <strong id="result-title">Reading recipe</strong>
            <p id="result-message">Getting it ready.</p>
            <a id="result-link" href="#" target="_blank" rel="noreferrer" hidden>
              View progress <i data-lucide="arrow-up-right" aria-hidden="true"></i>
            </a>
          </div>
        </div>
      </section>

      <aside class="activity entrance" aria-labelledby="activity-title">
        <div class="activity-heading">
          <h2 id="activity-title">Recent recipes</h2>
          <button class="icon-button" id="refresh-button" type="button" title="Refresh imports" aria-label="Refresh imports">
            <i data-lucide="refresh-cw" aria-hidden="true"></i>
          </button>
        </div>
        <div class="task-list" id="task-list" aria-live="polite">
          <div class="task-skeleton"></div>
          <div class="task-skeleton"></div>
          <div class="task-skeleton"></div>
        </div>
      </aside>
    </main>

    <footer class="footer">
      <span id="repository-label">Add Recipes</span>
      <a href="https://monmanger.com" target="_blank" rel="noreferrer">Go to Mon Manger <i data-lucide="arrow-up-right" aria-hidden="true"></i></a>
    </footer>
  </body>
</html>
