name: Auto-merge recipe PRs

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, synchronize, ready_for_review, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to validate and merge"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(fromJSON('["Copilot", "copilot-swe-agent[bot]", "app/copilot-swe-agent"]'), github.event.pull_request.user.login) &&
       !github.event.pull_request.draft &&
       !contains(github.event.pull_request.title, '[WIP]') &&
       !startsWith(github.event.pull_request.title, 'WIP '))
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ env.PR_NUMBER }}/merge

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
