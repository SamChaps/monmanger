name: Auto-merge recipe PRs

on:
  workflow_run:
    workflows: ["Copilot cloud agent"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to validate and merge"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-${{ github.event.workflow_run.head_branch || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      REQUESTED_PR: ${{ inputs.pr_number }}
      AGENT_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Resolve pull request
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_number="$REQUESTED_PR"
          if [[ -z "$pr_number" ]]; then
            pr_number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AGENT_BRANCH" --state open --json number --jq '.[0].number')
          fi
          if [[ -z "$pr_number" || "$pr_number" == "null" ]]; then
            echo "No open pull request found for $AGENT_BRANCH."
            exit 1
          fi
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Validate pull request source and files
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          author=$(jq -r '.user.login' <<< "$pr")
          base=$(jq -r '.base.ref' <<< "$pr")
          head_repo=$(jq -r '.head.repo.full_name' <<< "$pr")
          head_sha=$(jq -r '.head.sha' <<< "$pr")
          title=$(jq -r '.title' <<< "$pr")

          if [[ "$author" != "Copilot" || "$base" != "main" || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
            echo "Refusing untrusted pull request source."
            exit 1
          fi
          if [[ "$title" == *"[WIP]"* || "$title" == "WIP "* ]]; then
            echo "Review requested; leaving PR #$PR_NUMBER as a draft."
            echo "should_merge=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          recipe_count=0
          while IFS=$'\t' read -r status file; do
            if [[ "$status" == "added" && "$file" =~ ^_recipes/[^/]+\.md$ ]]; then
              recipe_count=$((recipe_count + 1))
            elif [[ "$status" == "added" && "$file" =~ ^_pages/tags/[^/]+\.md$ ]]; then
              continue
            elif [[ "$status" == "modified" && "$file" == "_data/tags.yml" ]]; then
              continue
            else
              echo "Refusing unexpected change: $status $file"
              exit 1
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[] | [.status, .filename] | @tsv')

          if [[ "$recipe_count" -eq 0 ]]; then
            echo "No new recipe file found."
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "should_merge=true" >> "$GITHUB_OUTPUT"

      - name: Checkout pull request
        if: steps.validate.outputs.should_merge == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.validate.outputs.head_sha }}
          persist-credentials: false

      - name: Setup Ruby
        if: steps.validate.outputs.should_merge == 'true'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        if: steps.validate.outputs.should_merge == 'true'
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Mark pull request ready
        if: steps.validate.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
        run: |
          if [[ $(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft') == "true" ]]; then
            gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          fi

      - name: Merge pull request
        if: steps.validate.outputs.should_merge == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ steps.validate.outputs.head_sha }}
        run: |
          current_head=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq '.headRefOid')
          if [[ -n "$EXPECTED_HEAD_SHA" && "$EXPECTED_HEAD_SHA" != "$current_head" ]]; then
            echo "Pull request changed during validation; waiting for the next run."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
